<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Try SHTTS speech synthesis in your browser. Turn Japanese kana into audio with WebAssembly." />
    <title>SHTTS · Speech synthesis demo</title>
  </head>
  <body>
    <main>
      <header><span class="eyebrow">RUST → WEBASSEMBLY</span><a href="https://github.com/Lqm1/shtts-rust">GitHub ↗</a></header>
      <h1>Give text a voice.</h1>
      <p class="intro">Try SHTTS speech synthesis in your browser. Your text stays on your device.</p>
      <form>
        <label for="text">Text to speak</label>
        <textarea id="text" maxlength="500" rows="4" placeholder="Enter Japanese hiragana or katakana"></textarea>
        <p class="hint">Japanese kana only. Hiragana is converted to katakana. Up to 500 characters.</p>
        <div class="controls"><div><label for="voice">Voice</label><select id="voice"><option value="Female">Female</option><option value="Male">Male</option><option value="Girl">Girl</option><option value="Boy">Boy</option><option value="Space">Space</option></select></div><button id="generate" disabled>Generate audio</button></div>
      </form>
      <p id="status" role="status" aria-live="polite">Loading the speech engine…</p>
      <audio controls hidden aria-label="Generated speech"></audio>
      <footer><a id="version" href="https://www.npmjs.com/package/shtts-wasm"></a><span>11,025 Hz · mono PCM</span></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
