[package]
name = "shtts"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic, fixed-point SHTTS speech synthesis"
license = "Apache-2.0"

[dependencies]

[workspace]
members = ["bindings/web"]
default-members = ["."]
resolver = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
