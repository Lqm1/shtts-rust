name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Validate and build SHTTS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies and build tools
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: wasm-bindgen-0.2.120

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run debug tests
        run: cargo test --workspace --locked

      - name: Run release tests
        run: cargo test --workspace --release --locked

      - name: Install WebAssembly build tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.120 --locked
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install locked development dependencies
        working-directory: demo
        run: npm ci --ignore-scripts

      - name: Pack npm package
        working-directory: demo
        run: |
          npm run build:wasm
          npm run pack:wasm

      - name: Install the release tarball
        working-directory: demo
        run: npm install --no-save --package-lock=false --ignore-scripts ../target/npm/shtts-wasm-*.tgz

      - name: Build demo from the release tarball
        working-directory: demo
        run: |
          npm run check
          npm run build

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: target/npm/
          if-no-files-found: error

      - name: Upload verified demo
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: demo/dist/
