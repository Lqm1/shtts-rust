name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: target/npm/
      - name: Check for an identical existing release
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const local = JSON.parse(readFileSync('target/npm/manifest.json'));
          const response = await fetch(`https://registry.npmjs.org/${local.name}/${local.version}`);
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`Registry returned ${response.status}`);
            const remote = await response.json();
            if (remote.dist.integrity !== local.integrity) throw new Error('Published version differs from this artifact');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status !== 404}\n`);
          JS
      - name: Publish using OIDC
        if: steps.registry.outputs.exists != 'true'
        run: npm publish ./target/npm/shtts-*.tgz --access public --ignore-scripts
      - name: Verify published integrity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const local = JSON.parse(readFileSync('target/npm/manifest.json'));
          const response = await fetch(`https://registry.npmjs.org/${local.name}/${local.version}`);
          if (!response.ok) throw new Error(`Registry returned ${response.status}`);
          const remote = await response.json();
          if (remote.dist.integrity !== local.integrity) throw new Error('Published package differs from the demo package');
          console.log(`Verified ${local.name}@${local.version}`);
          JS

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the verified demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
